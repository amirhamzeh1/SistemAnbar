name: Build SistemAnbar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/sistemanbar/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SistemAnbar"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.sistemanbar.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sistemanbar.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">سیستم انبار</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2563EB</item>
                  <item name="android:statusBarColor">#172033</item>
                  <item name="android:navigationBarColor">#172033</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="سیستم انبار"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sistemanbar/app/MainActivity.kt <<'EOF'
          package com.sistemanbar.app

          import android.app.*
          import android.os.*
          import android.content.*
          import android.database.sqlite.*
          import android.graphics.Color
          import android.view.*
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*

          data class Product(
              val id: Long,
              val code: String,
              val qty: Int,
              val line: Int,
              val side: String,
              val level: String,
              val note: String
          )

          class DB(context: Context) :
              SQLiteOpenHelper(context, "sistem_anbar.db", null, 1) {

              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("""
                      CREATE TABLE products(
                          id INTEGER PRIMARY KEY AUTOINCREMENT,
                          code TEXT NOT NULL,
                          qty INTEGER NOT NULL,
                          line INTEGER NOT NULL,
                          side TEXT NOT NULL,
                          level TEXT NOT NULL,
                          note TEXT,
                          created TEXT
                      )
                  """)
                  db.execSQL("CREATE INDEX idx_code ON products(code)")
              }

              override fun onUpgrade(
                  db: SQLiteDatabase,
                  oldVersion: Int,
                  newVersion: Int
              ) {}
          }

          class MainActivity : Activity() {

              lateinit var db: DB
              lateinit var code: EditText
              lateinit var qty: EditText
              lateinit var line: EditText
              lateinit var note: EditText
              lateinit var side: Spinner
              lateinit var level: Spinner
              lateinit var search: EditText
              lateinit var list: LinearLayout
              lateinit var stats: TextView

              var selectedId: Long = -1
              var exportText = ""

              fun dp(x: Int) =
                  (x * resources.displayMetrics.density).toInt()

              fun edit(h: String) =
                  EditText(this).apply {
                      hint = h
                      textSize = 15f
                      setPadding(
                          dp(12),
                          dp(8),
                          dp(12),
                          dp(8)
                      )
                  }

              fun btn(s: String) =
                  Button(this).apply {
                      text = s
                      textSize = 14f
                      isAllCaps = false
                  }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)

                  db = DB(this)

                  val scroll = ScrollView(this)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(
                          dp(12),
                          dp(12),
                          dp(12),
                          dp(25)
                      )
                      layoutDirection =
                          View.LAYOUT_DIRECTION_RTL
                  }

                  scroll.addView(root)

                  val title = TextView(this).apply {
                      text = "سیستم مدیریت انبار"
                      textSize = 24f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      setBackgroundColor(
                          Color.rgb(23, 32, 51)
                      )
                      setPadding(
                          5,
                          dp(15),
                          5,
                          dp(15)
                      )
                  }

                  root.addView(title)

                  stats = TextView(this).apply {
                      textSize = 14f
                      setPadding(
                          dp(5),
                          dp(12),
                          dp(5),
                          dp(12)
                      )
                  }

                  root.addView(stats)

                  search =
                      edit("🔎 کد کالا برای جستجو")

                  root.addView(search)

                  val searchButton =
                      btn("جستجوی کالا")

                  root.addView(searchButton)

                  list =
                      LinearLayout(this).apply {
                          orientation =
                              LinearLayout.VERTICAL
                      }

                  root.addView(list)

                  val heading =
                      TextView(this).apply {
                          text = "➕ ثبت کالا"
                          textSize = 21f
                          setPadding(
                              5,
                              dp(12),
                              5,
                              dp(8)
                          )
                      }

                  root.addView(heading)

                  code = edit("کد کالا")
                  qty = edit("تعداد")
                  line = edit("شماره لاین")
                  note = edit("توضیحات")

                  qty.inputType = 2
                  line.inputType = 2

                  root.addView(code)
                  root.addView(qty)
                  root.addView(line)

                  side = Spinner(this)

                  side.adapter =
                      ArrayAdapter(
                          this,
                          android.R.layout
                              .simple_spinner_dropdown_item,
                          arrayOf("راست", "چپ")
                      )

                  root.addView(side)

                  level = Spinner(this)

                  level.adapter =
                      ArrayAdapter(
                          this,
                          android.R.layout
                              .simple_spinner_dropdown_item,
                          arrayOf(
                              "بالا",
                              "وسط",
                              "پایین",
                              "داخل"
                          )
                      )

                  root.addView(level)
                  root.addView(note)

                  val save = btn("💾 ذخیره")
                  val update = btn("✏️ ویرایش")
                  val delete = btn("🗑️ حذف")
                  val clear = btn("پاک کردن")
                  val all = btn("📦 نمایش همه")
                  val excel = btn("📊 خروجی Excel")

                  root.addView(save)
                  root.addView(update)
                  root.addView(delete)
                  root.addView(clear)
                  root.addView(all)
                  root.addView(excel)

                  save.setOnClickListener {
                      saveProduct()
                  }

                  update.setOnClickListener {
                      updateProduct()
                  }

                  delete.setOnClickListener {
                      deleteProduct()
                  }

                  clear.setOnClickListener {
                      clearForm()
                  }

                  searchButton.setOnClickListener {
                      searchProduct()
                  }

                  all.setOnClickListener {
                      showAll()
                  }

                  excel.setOnClickListener {
                      exportCSV()
                  }

                  setContentView(scroll)

                  showAll()
                  updateStats()
              }

              fun getProduct(): Product? {

                  val c = code.text.toString().trim()
                  val q =
                      qty.text.toString().toIntOrNull()
                  val l =
                      line.text.toString().toIntOrNull()

                  if (c.isEmpty()) {
                      toast("کد کالا را وارد کنید")
                      return null
                  }

                  if (q == null || q < 0) {
                      toast("تعداد صحیح وارد کنید")
                      return null
                  }

                  if (l == null || l < 1) {
                      toast("شماره لاین صحیح وارد کنید")
                      return null
                  }

                  return Product(
                      selectedId,
                      c,
                      q,
                      l,
                      side.selectedItem.toString(),
                      level.selectedItem.toString(),
                      note.text.toString()
                  )
              }

              fun saveProduct() {

                  val p = getProduct() ?: return

                  val v = ContentValues()

                  v.put("code", p.code)
                  v.put("qty", p.qty)
                  v.put("line", p.line)
                  v.put("side", p.side)
                  v.put("level", p.level)
                  v.put("note", p.note)

                  v.put(
                      "created",
                      SimpleDateFormat(
                          "yyyy-MM-dd HH:mm",
                          Locale.getDefault()
                      ).format(Date())
                  )

                  db.writableDatabase.insert(
                      "products",
                      null,
                      v
                  )

                  toast("کالا ذخیره شد")

                  clearForm()
                  showAll()
                  updateStats()
              }

              fun updateProduct() {

                  if (selectedId < 0) {
                      toast("ابتدا یک کالا انتخاب کنید")
                      return
                  }

                  val p = getProduct() ?: return
                  val v = ContentValues()

                  v.put("code", p.code)
                  v.put("qty", p.qty)
                  v.put("line", p.line)
                  v.put("side", p.side)
                  v.put("level", p.level)
                  v.put("note", p.note)

                  db.writableDatabase.update(
                      "products",
                      v,
                      "id=?",
                      arrayOf(selectedId.toString())
                  )

                  toast("ویرایش انجام شد")

                  clearForm()
                  showAll()
                  updateStats()
              }

              fun deleteProduct() {

                  if (selectedId < 0) {
                      toast("ابتدا یک کالا انتخاب کنید")
                      return
                  }

                  db.writableDatabase.delete(
                      "products",
                      "id=?",
                      arrayOf(selectedId.toString())
                  )

                  toast("کالا حذف شد")

                  clearForm()
                  showAll()
                  updateStats()
              }

              fun clearForm() {

                  selectedId = -1
                  code.setText("")
                  qty.setText("")
                  line.setText("")
                  note.setText("")
                  side.setSelection(0)
                  level.setSelection(0)
              }

              fun searchProduct() {

                  val q =
                      search.text.toString().trim()

                  if (q.isEmpty()) {
                      showAll()
                      return
                  }

                  val cursor =
                      db.readableDatabase.rawQuery(
                          "SELECT * FROM products " +
                          "WHERE code LIKE ? " +
                          "ORDER BY line",
                          arrayOf("%$q%")
                      )

                  render(cursor, "نتیجه جستجو: $q")
              }

              fun showAll() {

                  val cursor =
                      db.readableDatabase.rawQuery(
                          "SELECT * FROM products " +
                          "ORDER BY line,code",
                          null
                      )

                  render(cursor, "تمام کالاها")
              }

              fun render(
                  cursor: Cursor,
                  title: String
              ) {

                  list.removeAllViews()

                  val head =
                      TextView(this).apply {
                          text =
                              "$title\nنتایج: ${cursor.count}"
                          textSize = 17f
                          setPadding(
                              5,
                              dp(10),
                              5,
                              dp(10)
                          )
                      }

                  list.addView(head)

                  if (cursor.count == 0) {

                      val empty =
                          TextView(this).apply {
                              text = "موردی پیدا نشد."
                              textSize = 15f
                              gravity = Gravity.CENTER
                              setPadding(
                                  5,
                                  dp(20),
                                  5,
                                  dp(20)
                              )
                          }

                      list.addView(empty)
                      cursor.close()
                      return
                  }

                  while (cursor.moveToNext()) {

                      val id =
                          cursor.getLong(
                              cursor.getColumnIndexOrThrow(
                                  "id"
                              )
                          )

                      val c =
                          cursor.getString(
                              cursor.getColumnIndexOrThrow(
                                  "code"
                              )
                          )

                      val q =
                          cursor.getInt(
                              cursor.getColumnIndexOrThrow(
                                  "qty"
                              )
                          )

                      val l =
                          cursor.getInt(
                              cursor.getColumnIndexOrThrow(
                                  "line"
                              )
                          )

                      val s =
                          cursor.getString(
                              cursor.getColumnIndexOrThrow(
                                  "side"
                              )
                          )

                      val lv =
                          cursor.getString(
                              cursor.getColumnIndexOrThrow(
                                  "level"
                              )
                          )

                      val n =
                          cursor.getString(
                              cursor.getColumnIndexOrThrow(
                                  "note"
                              )
                          ) ?: ""

                      val item =
                          btn(
                              "کد: $c | تعداد: $q\n" +
                              "لاین: $l | سمت: $s | طبقه: $lv" +
                              if (n.isNotBlank())
                                  "\nتوضیحات: $n"
                              else ""
                          )

                      item.setOnClickListener {

                          selectedId = id

                          code.setText(c)
                          qty.setText(q.toString())
                          line.setText(l.toString())
                          note.setText(n)

                          side.setSelection(
                              if (s == "چپ") 1 else 0
                          )

                          level.setSelection(
                              when (lv) {
                                  "وسط" -> 1
                                  "پایین" -> 2
                                  "داخل" -> 3
                                  else -> 0
                              }
                          )

                          toast("کالا انتخاب شد")
                      }

                      list.addView(
                          item,
                          LinearLayout.LayoutParams(
                              -1,
                              dp(82)
                          )
                      )
                  }

                  cursor.close()
              }

              fun updateStats() {

                  val d = db.readableDatabase

                  val a =
                      d.rawQuery(
                          "SELECT COUNT(*) FROM products",
                          null
                      )

                  a.moveToFirst()
                  val records = a.getInt(0)
                  a.close()

                  val b =
                      d.rawQuery(
                          "SELECT COALESCE(SUM(qty),0) " +
                          "FROM products",
                          null
                      )

                  b.moveToFirst()
                  val total = b.getInt(0)
                  b.close()

                  val c =
                      d.rawQuery(
                          "SELECT COUNT(DISTINCT code) " +
                          "FROM products",
                          null
                      )

                  c.moveToFirst()
                  val codes = c.getInt(0)
                  c.close()

                  stats.text =
                      "محل‌ها: $records | موجودی: $total\n" +
                      "کدهای کالا: $codes"
              }

              fun exportCSV() {

                  val cursor =
                      db.readableDatabase.rawQuery(
                          "SELECT code,qty,line,side," +
                          "level,note,created " +
                          "FROM products " +
                          "ORDER BY line,code",
                          null
                      )

                  val sb = StringBuilder()

                  sb.append("\uFEFF")
                  sb.append(
                      "کد کالا,تعداد,شماره لاین," +
                      "سمت,طبقه,توضیحات,تاریخ ثبت\n"
                  )

                  while (cursor.moveToNext()) {

                      for (i in 0 until cursor.columnCount) {

                          if (i > 0)
                              sb.append(",")

                          val value =
                              cursor.getString(i) ?: ""

                          sb.append(
                              "\"" +
                              value.replace(
                                  "\"",
                                  "\"\""
                              ) +
                              "\""
                          )
                      }

                      sb.append("\n")
                  }

                  cursor.close()

                  exportText = sb.toString()

                  val intent =
                      Intent(Intent.ACTION_CREATE_DOCUMENT)

                  intent.type = "text/csv"

                  intent.putExtra(
                      Intent.EXTRA_TITLE,
                      "SistemAnbar.csv"
                  )

                  startActivityForResult(
                      intent,
                      500
                  )
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode == 500 &&
                      resultCode == RESULT_OK &&
                      data?.data != null
                  ) {

                      contentResolver
                          .openOutputStream(data.data!!)
                          ?.use {
                              it.write(
                                  exportText.toByteArray(
                                      Charsets.UTF_8
                                  )
                              )
                          }

                      toast("فایل خروجی ذخیره شد")
                  }
              }

              fun toast(s: String) {

                  Toast.makeText(
                      this,
                      s,
                      Toast.LENGTH_SHORT
                  ).show()
              }
          }
          EOF

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SistemAnbar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
