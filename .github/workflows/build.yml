name: Build SistemAnbar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Create Android project folders
      # ==========================================
      - name: Create project folders
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/sistemanbar/app
          mkdir -p app/src/main/res/values

      # ==========================================
      # 2. Create settings.gradle
      # ==========================================
      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SistemAnbar"
          include(":app")
          EOF

      # ==========================================
      # 3. Create root build.gradle
      # ==========================================
      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

      # ==========================================
      # 4. Create gradle.properties
      # ==========================================
      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # ==========================================
      # 5. Create app/build.gradle
      # ==========================================
      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.sistemanbar.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sistemanbar.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      # ==========================================
      # 6. Create strings.xml
      # ==========================================
      - name: Create strings.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">سیستم انبار</string>
          </resources>
          EOF

      # ==========================================
      # 7. Create styles.xml
      # ==========================================
      - name: Create styles.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1565C0</item>
                  <item name="android:statusBarColor">#102A43</item>
                  <item name="android:navigationBarColor">#102A43</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>

              </style>

          </resources>
          EOF

      # ==========================================
      # 8. Create AndroidManifest.xml
      # ==========================================
      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ==========================================
      # 9. Create MainActivity.kt
      # ==========================================
      - name: Create MainActivity.kt
        shell: bash
        run: |
          cat > app/src/main/java/com/sistemanbar/app/MainActivity.kt <<'EOF'
          package com.sistemanbar.app

          import android.app.Activity
          import android.os.Bundle
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.database.Cursor
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import android.graphics.Color
          import android.view.Gravity
          import android.view.View
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.Space
          import android.widget.TextView
          import android.widget.Toast
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          data class Product(
              val id: Long,
              val code: String,
              val quantity: Int,
              val line: Int,
              val side: String,
              val level: String,
              val note: String
          )

          class DatabaseHelper(context: Context) :
              SQLiteOpenHelper(
                  context,
                  "sistem_anbar.db",
                  null,
                  1
              ) {

              override fun onCreate(db: SQLiteDatabase) {

                  db.execSQL(
                      """
                      CREATE TABLE products (
                          id INTEGER PRIMARY KEY AUTOINCREMENT,
                          code TEXT NOT NULL,
                          quantity INTEGER NOT NULL,
                          line_number INTEGER NOT NULL,
                          side TEXT NOT NULL,
                          level TEXT NOT NULL,
                          note TEXT,
                          created_at TEXT NOT NULL
                      )
                      """.trimIndent()
                  )

                  db.execSQL(
                      "CREATE INDEX idx_products_code ON products(code)"
                  )

                  db.execSQL(
                      "CREATE INDEX idx_products_line ON products(line_number)"
                  )
              }

              override fun onUpgrade(
                  db: SQLiteDatabase,
                  oldVersion: Int,
                  newVersion: Int
              ) {
                  // Future database upgrades can be added here.
              }
          }

          class MainActivity : Activity() {

              private lateinit var database: DatabaseHelper

              private lateinit var codeInput: EditText
              private lateinit var quantityInput: EditText
              private lateinit var lineInput: EditText
              private lateinit var noteInput: EditText

              private lateinit var searchInput: EditText

              private lateinit var sideSpinner: Spinner
              private lateinit var levelSpinner: Spinner

              private lateinit var productsContainer: LinearLayout
              private lateinit var statisticsText: TextView

              private var selectedProductId: Long = -1

              private var exportText: String = ""

              private fun dp(value: Int): Int {
                  return (
                      value *
                      resources.displayMetrics.density
                  ).toInt()
              }

              private fun createEditText(
                  hintText: String
              ): EditText {

                  return EditText(this).apply {

                      hint = hintText

                      textSize = 16f

                      setPadding(
                          dp(12),
                          dp(8),
                          dp(12),
                          dp(8)
                      )

                      layoutParams =
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply {

                              setMargins(
                                  0,
                                  dp(5),
                                  0,
                                  dp(5)
                              )
                          }
                  }
              }

              private fun createButton(
                  textValue: String
              ): Button {

                  return Button(this).apply {

                      text = textValue

                      textSize = 15f

                      isAllCaps = false

                      layoutParams =
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply {

                              setMargins(
                                  0,
                                  dp(4),
                                  0,
                                  dp(4)
                              )
                          }
                  }
              }

